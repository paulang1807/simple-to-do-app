    // ─────────────────────────────────────────
    // Calendar Popover
    // ─────────────────────────────────────────

    // Tracks the month/year currently displayed in the popover (may differ from activeMonth)
    let _calYear = null;
    let _calMonth = null; // 1-based

    function toggleCalendar(event) {
      const pop = document.getElementById('cal-popover');
      if (pop.classList.contains('open')) {
        closeCalendar();
        return;
      }
      // Initialise to active month
      const [y, m] = state.activeMonth.split('-').map(Number);
      _calYear = y;
      _calMonth = m;
      renderCalendar();
      pop.classList.add('open');

      // Position below the button
      const btn = document.getElementById('cal-btn');
      const btnRect = btn.getBoundingClientRect();
      pop.style.top = (btnRect.bottom + 6) + 'px';
      // Align right edge of popover with right edge of button
      const popWidth = 252;
      let left = btnRect.right - popWidth;
      if (left < 8) left = 8;
      pop.style.left = left + 'px';
    }

    function closeCalendar() {
      document.getElementById('cal-popover').classList.remove('open');
    }

    function calNavYear(delta) {
      _calYear += delta;
      renderCalendar();
    }

    function calNavMonth(delta) {
      _calMonth += delta;
      if (_calMonth > 12) { _calMonth = 1; _calYear++; }
      if (_calMonth < 1) { _calMonth = 12; _calYear--; }
      renderCalendar();
    }

    function renderCalendar() {
      const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      document.getElementById('cal-year-label').textContent = _calYear;
      document.getElementById('cal-month-label').textContent = MONTHS[_calMonth - 1];

      const today = todayKey();
      const activeDay = state.activeDay;
      const ym = `${_calYear}-${String(_calMonth).padStart(2, '0')}`;

      // First day of month (0=Sun … 6=Sat)
      const firstDow = new Date(_calYear, _calMonth - 1, 1).getDay();
      const daysInMonth = new Date(_calYear, _calMonth, 0).getDate();

      // Previous month fill
      const prevMonthDays = new Date(_calYear, _calMonth - 1, 0).getDate();

      const DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
      let html = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');

      // Leading days from previous month
      for (let i = firstDow - 1; i >= 0; i--) {
        const day = prevMonthDays - i;
        const prevYm = _calMonth === 1
          ? `${_calYear - 1}-12`
          : `${_calYear}-${String(_calMonth - 1).padStart(2, '0')}`;
        const key = `${prevYm}-${String(day).padStart(2, '0')}`;
        html += calDayCell(key, day, true, today, activeDay);
      }

      // Current month days
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${ym}-${String(d).padStart(2, '0')}`;
        html += calDayCell(key, d, false, today, activeDay);
      }

      // Trailing days from next month
      const totalCells = Math.ceil((firstDow + daysInMonth) / 7) * 7;
      const trailing = totalCells - firstDow - daysInMonth;
      for (let d = 1; d <= trailing; d++) {
        const nextYm = _calMonth === 12
          ? `${_calYear + 1}-01`
          : `${_calYear}-${String(_calMonth + 1).padStart(2, '0')}`;
        const key = `${nextYm}-${String(d).padStart(2, '0')}`;
        html += calDayCell(key, d, true, today, activeDay);
      }

      document.getElementById('cal-grid').innerHTML = html;
    }

    function calDayCell(key, dayNum, otherMonth, today, activeDay) {
      const hasTasks = state.days[key] && state.days[key].tasks && state.days[key].tasks.length > 0;
      const isToday = key === today;
      const isSelected = key === activeDay;
      const classes = [
        'cal-day',
        otherMonth ? 'other-month' : '',
        isToday ? 'today' : '',
        isSelected ? 'selected' : '',
        hasTasks ? 'has-tasks' : '',
      ].filter(Boolean).join(' ');
      return `<div class="${classes}" onclick="calSelectDay('${key}')" title="${key}">
    ${dayNum}
    <span class="cal-dot"></span>
  </div>`;
    }

    async function calSelectDay(key) {
      closeCalendar();
      const month = key.slice(0, 7);
      if (month !== state.activeMonth) {
        await selectMonth(month);
      }
      selectDay(key);
    }

    // Close calendar when clicking outside
    document.addEventListener('click', e => {
      const pop = document.getElementById('cal-popover');
      const btn = document.getElementById('cal-btn');
      if (pop.classList.contains('open') && !pop.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        closeCalendar();
      }
    });

    let _searchFocusIndex = -1;

    async function openSearchModal() {
      // Load all known months so search covers all history
      const known = await loadKnownMonths();
      for (const m of known) await loadMonth(m);

      document.getElementById('search-overlay').classList.add('open');
      const inp = document.getElementById('search-input');
      inp.value = '';
      document.getElementById('search-results').innerHTML = '';
      document.getElementById('search-meta').style.display = 'none';
      _searchFocusIndex = -1;
      setTimeout(() => inp.focus(), 50);
    }

    function closeSearchModal() {
      document.getElementById('search-overlay').classList.remove('open');
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').innerHTML = '';
      document.getElementById('search-meta').style.display = 'none';
      _searchFocusIndex = -1;
    }

    // Collect all tasks across all loaded days as flat result objects
    function searchAllTasks(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const results = [];
      const dayKeys = Object.keys(state.days).sort().reverse(); // newest first

      for (const dayKey of dayKeys) {
        const tasks = (state.days[dayKey] && state.days[dayKey].tasks) || [];
        collectMatchingTasks(tasks, dayKey, [], q, results);
      }
      return results;
    }

    function collectMatchingTasks(tasks, dayKey, ancestors, query, results) {
      for (const task of tasks) {
        const matchesText = task.text.toLowerCase().includes(query);
        const matchesNote = (task.context && task.context.notes || [])
          .some(n => n.text && n.text.toLowerCase().includes(query));

        if (matchesText || matchesNote) {
          results.push({
            task,
            dayKey,
            ancestors: [...ancestors],
            matchesNote: !matchesText && matchesNote,
          });
        }
        if (task.children && task.children.length) {
          collectMatchingTasks(task.children, dayKey, [...ancestors, task.text], query, results);
        }
      }
    }

    function highlightMatch(text, query) {
      const idx = text.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return escHtml(text);
      return escHtml(text.slice(0, idx))
        + `<mark>${escHtml(text.slice(idx, idx + query.length))}</mark>`
        + escHtml(text.slice(idx + query.length));
    }

    function formatSearchDate(dayKey) {
      const d = new Date(dayKey + 'T00:00:00');
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    let _searchDebounce = null;
    function onSearchInput() {
      clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(runSearch, 120);
    }

    function runSearch() {
      const query = document.getElementById('search-input').value;
      const resultsEl = document.getElementById('search-results');
      const metaEl = document.getElementById('search-meta');
      _searchFocusIndex = -1;

      if (!query.trim()) {
        resultsEl.innerHTML = '';
        metaEl.style.display = 'none';
        return;
      }

      const results = searchAllTasks(query);

      if (results.length === 0) {
        resultsEl.innerHTML = `<div class="search-empty">No tasks matching "<strong>${escHtml(query)}</strong>"</div>`;
        metaEl.style.display = 'none';
        return;
      }

      metaEl.textContent = `${results.length} result${results.length === 1 ? '' : 's'}`;
      metaEl.style.display = 'block';

      const q = query.trim().toLowerCase();
      resultsEl.innerHTML = results.map((r, i) => {
        const { task, dayKey, ancestors, matchesNote } = r;
        const statusIcon = task.status === 'done' ? '✓' : task.status === 'partial' ? '◑' : '○';
        const badges = [];
        if (task.status === 'done') badges.push(`<span class="search-badge done">✓ Done</span>`);
        if (task.status === 'partial') badges.push(`<span class="search-badge partial">◑ Partial</span>`);
        if (task.important) badges.push(`<span class="search-badge important">⭐ Important</span>`);
        if (task.recurring && !task.closed) badges.push(`<span class="search-badge recurring">🔁 Recurring</span>`);

        const crumbHtml = ancestors.length
          ? `<span class="search-result-crumb">${ancestors.map(a => escHtml(a)).join(' › ')} › </span>`
          : '';
        const noteHint = matchesNote ? `<span style="color:var(--text3);font-style:italic;"> (matched in note)</span>` : '';

        return `<div class="search-result" data-index="${i}" data-day="${escHtml(dayKey)}" data-id="${escHtml(task.id)}"
                 onclick="jumpToSearchResult('${escHtml(dayKey)}','${escHtml(task.id)}')"
                 onmouseenter="setSearchFocus(${i})">
      <div class="search-result-icon">${statusIcon}</div>
      <div class="search-result-body">
        <div class="search-result-text">${crumbHtml}${highlightMatch(task.text, query)}${noteHint}</div>
        <div class="search-result-meta">
          <span class="search-result-date">${formatSearchDate(dayKey)}</span>
          ${badges.join('')}
        </div>
      </div>
    </div>`;
      }).join('');
    }

    function setSearchFocus(index) {
      _searchFocusIndex = index;
      document.querySelectorAll('.search-result').forEach((el, i) => {
        el.classList.toggle('focused', i === index);
      });
    }

    function onSearchKey(e) {
      const items = document.querySelectorAll('.search-result');
      if (e.key === 'Escape') {
        closeSearchModal();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        const next = Math.min(_searchFocusIndex + 1, items.length - 1);
        setSearchFocus(next);
        items[next] && items[next].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prev = Math.max(_searchFocusIndex - 1, 0);
        setSearchFocus(prev);
        items[prev] && items[prev].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (_searchFocusIndex >= 0 && items[_searchFocusIndex]) {
          const el = items[_searchFocusIndex];
          jumpToSearchResult(el.dataset.day, el.dataset.id);
        } else if (items.length === 1) {
          const el = items[0];
          jumpToSearchResult(el.dataset.day, el.dataset.id);
        }
      }
    }

    async function jumpToSearchResult(dayKey, taskId) {
      closeSearchModal();
      // Switch to the right month if needed
      const month = dayKey.slice(0, 7);
      if (!_loadedMonths.has(month)) await loadMonth(month);
      state.activeMonth = month;
      state.activeDay = dayKey;
      render();
      // Expand ancestors and scroll to + highlight the task
      setTimeout(() => {
        // Ensure the task's parent chain is expanded
        expandToTask(state.days[dayKey] && state.days[dayKey].tasks || [], taskId);
        renderTaskArea();
        setTimeout(() => {
          const el = document.getElementById(`tr-${taskId}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('search-highlight');
            setTimeout(() => el.classList.remove('search-highlight'), 1800);
          }
        }, 80);
      }, 80);
    }

    // Expand any collapsed ancestor so the target task is visible
    function expandToTask(tasks, targetId) {
      for (const t of tasks) {
        if (t.id === targetId) return true;
        if (t.children && t.children.length) {
          if (expandToTask(t.children, targetId)) {
            _collapsed.delete(t.id); // ensure parent is expanded
            return true;
          }
        }
      }
      return false;
    }

    // Keyboard shortcut: Cmd/Ctrl+K
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        if (document.getElementById('search-overlay').classList.contains('open')) {
          closeSearchModal();
        } else {
          openSearchModal();
        }
      }
    });

    function openSummaryModal() {
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeSummaryModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      document.getElementById('sum-output').innerHTML = 'Select a period and click Generate.';
    }

    document.getElementById('sum-period').addEventListener('change', function () {
      document.getElementById('sum-custom').style.display = this.value === 'custom' ? 'flex' : 'none';
    });

    function dateToKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function summaryDateRange(period) {
      const today = new Date(todayKey() + 'T00:00:00');
      let fromKey, toKey;
      if (period === 'week') {
        const day = today.getDay();
        const diff = (day === 0) ? 6 : day - 1;
        const from = new Date(today); from.setDate(today.getDate() - diff);
        fromKey = dateToKey(from); toKey = todayKey();
      } else if (period === 'month') {
        fromKey = `${todayKey().slice(0, 7)}-01`; toKey = todayKey();
      } else if (period === 'quarter') {
        const m = today.getMonth();
        const qStart = Math.floor(m / 3) * 3;
        fromKey = dateToKey(new Date(today.getFullYear(), qStart, 1)); toKey = todayKey();
      } else if (period === 'year') {
        fromKey = `${today.getFullYear()}-01-01`; toKey = todayKey();
      } else {
        fromKey = document.getElementById('sum-from').value;
        toKey = document.getElementById('sum-to').value;
      }
      return { fromKey, toKey };
    }

    // Collect all day data objects in range (including months not yet loaded from disk)
    async function loadMissingMonthsForRange(fromKey, toKey) {
      // Determine which months overlap the range
      const fromMonth = fromKey.slice(0, 7);
      const toMonth = toKey.slice(0, 7);
      let cur = fromMonth;
      while (cur <= toMonth) {
        if (!Object.keys(state.days).some(k => k.startsWith(cur))) {
          await loadMonth(cur);
        }
        const [y, m] = cur.split('-').map(Number);
        const next = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`;
        cur = next;
      }
    }

    async function generateSummary() {
      const period = document.getElementById('sum-period').value;
      const { fromKey, toKey } = summaryDateRange(period);
      if (!fromKey || !toKey) {
        document.getElementById('sum-output').textContent = 'Please set a date range.';
        return;
      }

      // Load any months not yet in memory
      await loadMissingMonthsForRange(fromKey, toKey);

      // Collect day data in range
      const daysInRange = Object.keys(state.days)
        .filter(k => k >= fromKey && k <= toKey)
        .sort();

      if (!daysInRange.length) {
        document.getElementById('sum-output').innerHTML = '<span style="color:var(--text3)">No tasks found in this period.</span>';
        return;
      }

      const daysPayload = {};
      daysInRange.forEach(k => { daysPayload[k] = state.days[k]; });

      // Parse optional topics
      const topicsRaw = document.getElementById('sum-topics').value;
      const topics = topicsRaw.split('\n').map(s => s.trim()).filter(Boolean);

      // Show loading state
      const el = document.getElementById('sum-output');
      el.className = 'summary-output loading';
      el.textContent = '✦ Generating summary…';
      document.getElementById('sum-generate-btn').disabled = true;

      try {
        const resp = await fetch('/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fromKey, toKey, period, topics, days: daysPayload }),
        });
        const data = await resp.json();

        el.className = 'summary-output';
        if (data.error) {
          el.innerHTML = `<span class="sum-error">⚠ ${escHtml(data.error)}</span>`;
        } else {
          renderSummaryText(el, data.summary || 'No summary generated.');
        }
      } catch (err) {
        el.className = 'summary-output';
        el.innerHTML = `<span class="sum-error">⚠ Could not reach server: ${escHtml(String(err))}</span>`;
      } finally {
        document.getElementById('sum-generate-btn').disabled = false;
      }
    }

    function renderSummaryText(el, text) {
      // Split on the stats line (starts with "Period:") and render as paragraphs
      const statsMatch = text.match(/\n?(Period:.+)$/s);
      let prose = text;
      let statsLine = '';
      if (statsMatch) {
        prose = text.slice(0, statsMatch.index).trim();
        statsLine = statsMatch[1].trim();
      }

      // Split prose into paragraphs and escape HTML
      const paragraphs = prose.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
      let html = paragraphs.map(p =>
        `<p>${escHtml(p).replace(/\n/g, '<br>')}</p>`
      ).join('');

      if (statsLine) {
        html += `<div class="sum-stats">${escHtml(statsLine)}</div>`;
      }

      el.innerHTML = html;
    }

    // Keep gatherStats for backwards compatibility (used by countDescendants etc.)
    function gatherStats(task, dayInfo, depth = 0) {
      if (task.excludeFromSummary) return;
      const entry = { text: task.text, status: task.status, depth };
      dayInfo.tasks.push(entry);
      if (task.status === 'done') dayInfo.done++;
      else if (task.status === 'partial') dayInfo.partial++;
      else dayInfo.pending++;
      task.children.forEach(c => gatherStats(c, dayInfo, depth + 1));
    }

    function renderSummary(s) {
      // Legacy stub — no longer called; generateSummary() renders directly
      return;
    }

    // ─────────────────────────────────────────
    // Boot
    // ─────────────────────────────────────────
    init();
  </script>
</body>
